ение g: на Луне оно составляет всего 1.62 м/с², на Земле — 9.81 м/с², а на поверхности нейтронной звезды превышает сотни миллиардов м/с².",inGameNote:"В Physics World гравитация каждой из 30 планет направлена радиально к центру планеты. Ваши прыжки, падения обломков и траектории снарядов искривляются строго по радиальному гравитационному полю!",diagramType:"gravity"},{id:"momentum",title:"Закон сохранения импульса",category:"mechanics",categoryName:"Механика и Гравитация",formula:"p = m · v,  Σp = const",formulaMeaning:"p — вектор импульса, m — масса тела, v — скорость",summary:"В замкнутой системе векторная сумма импульсов всех тел остаётся постоянной при любых взаимодействиях и столкновениях.",details:"Импульс характеризует количество движения. При выстреле снаряд получает импульс вперёд, а стрелок испытывает равный по модулю импульс отдачи назад. При попадании высокоскоростного сгустка материи в препятствие кинетическая энергия переходит в разрушение породы, тепло и передачу импульса цели.",inGameNote:"Способность «Кинетический импульс» запускает плазменный снаряд: он летит по баллистической дуге, пробивает кратер в планете и отбрасывает врагов пропорционально переданному импульсу.",diagramType:"momentum"},{id:"orbital",title:"Баллистика и Первая космическая скорость",category:"mechanics",categoryName:"Механика и Гравитация",formula:"v₁ = √(G · M / R)",formulaMeaning:"v₁ — первая космическая скорость, R — радиус планеты",summary:"Если придать телу достаточную горизонтальную скорость, траектория его падения совпадёт с кривизной планеты — тело выйдет на орбиту.",details:"На большой сферической планете снаряд, выпущенный горизонтально, не просто падает вниз — он огибает кривизну горизонта! Чем слабее гравитация (например, на Луне, Плутоне или астероиде), тем длиннее и положе баллистическая дуга, вплоть до полного облёта планеты по орбите.",inGameNote:"Наводите прицел в игре и следите за пунктирной линией баллистического расчёта: на Луне и Плутоне можно стрелять навесом за горизонт, огибая целые горные хребты!",diagramType:"orbital"},{id:"coulomb",title:"Закон Кулона и Электрическая дуга",category:"electromagnetism",categoryName:"Электромагнетизм",formula:"F = k · |q₁ · q₂| / r²",formulaMeaning:"k ≈ 8.99·10⁹ Н·м²/Кл², q₁ и q₂ — электрические заряды",summary:"Электрические заряды взаимодействуют через электромагнитное поле; при высокой напряжённости происходит ионизация среды и пробой в виде дуги.",details:"Электрический разряд ищет путь наименьшего сопротивления, ионизируя газ в плазменный канал. В отличие от гравитации, электромагнитное взаимодействие сильнее гравитационного на десятки порядков и может как притягивать, так и отталкивать заряженные частицы.",inGameNote:"Способность «Разряд Кулона» создаёт мгновенную цепную молнию, перескакивающую между несколькими врагами благодаря локальной ионизации.",diagramType:"coulomb"},{id:"induction",title:"Электромагнитная индукция и Катушка Теслы",category:"electromagnetism",categoryName:"Электромагнетизм",formula:"∇ × E = −∂B / ∂t",formulaMeaning:"Уравнение Максвелла-Фарадея: переменное магнитное поле порождает вихревое электрическое поле",summary:"Изменение магнитного потока во времени индуцирует электрическое поле и ток в проводниках. Резонансные трансформаторы создают сверхвысокое напряжение.",details:"Никола Тесла создал резонансный трансформатор, способный передавать энергию высокочастотными электромагнитными импульсами. Уравнения Максвелла объединили электричество, магнетизм и свет в единую фундаментальную теорию.",inGameNote:"«Катушка Теслы» разворачивается прямо на поверхности планеты перпендикулярно рельефу и автоматически поражает врагов в радиусе действия.",diagramType:"induction"},{id:"antigravity",title:"Антигравитация и Компенсация поля",category:"relativity",categoryName:"Теория Относительности",formula:"F_рез = F_анти − m·g",formulaMeaning:"Компенсация веса за счёт направленного поля отталкивания или магнитной левитации",summary:"В современной физике обсуждаются гравитомагнетизм, диамагнитная левитация и гипотетическая отрицательная плотность энергии (тёмная энергия).",details:"Хотя классическая гравитация всегда притягивает, ускоренное расширение Вселенной под действием тёмной энергии (космологической постоянной Λ в уравнениях Эйнштейна) демонстрирует реальный эффект космического гравитационного отталкивания. Локальная левитация также достигается сверхпроводниками в магнитном поле (эффект Мейснера).",inGameNote:"Включите «Антигравитацию», чтобы компенсировать вес физика, взлетать над глубокими кратерами и свободно маневрировать в небе любой планеты. Помните: поддержание поля расходует энергию E!",diagramType:"antigravity"},{id:"wormhole",title:"Мост Эйнштейна-Розена (Червоточина)",category:"relativity",categoryName:"Теория Относительности",formula:"ds² = −c²dt² + dr² + (r² + b₀²)dΩ²",formulaMeaning:"Метрика проходимой кротовой норы Морриса-Торна, b₀ — радиус горловины",summary:"Топологический туннель в искривлённом пространстве-времени, соединяющий две удалённые области Вселенной кратчайшим путём.",details:"В 1935 году Альберт Эйнштейн и Натан Розен показали, что уравнения Общей теории относительности допускают существование «мостов» между удалёнными точками пространства-времени. Чтобы удержать горловину червоточины открытой, требуется экзотическая материя с отрицательным давлением (нарушающая слабое энергетическое условие, аналогично эффекту Казимира).",inGameNote:"Активируйте «Мост Эйнштейна-Розена» и укажите любую точку в зоне видимости: физик мгновенно переместится сквозь горловину, даже сквозь толщу гор и скал!",diagramType:"wormhole"},{id:"relativity",title:"Специальная теория относительности и Скорость света",category:"relativity",categoryName:"Теория Относительности",formula:"γ = 1 / √(1 − v²/c²),  Δt = γ·Δt₀",formulaMeaning:"γ — фактор Лоренца, c ≈ 299 792 458 м/с — скорость света в вакууме",summary:"При приближении скорости движения к скорости света время для наблюдателя замедляется, длины сокращаются, а спектр света смещается (эффект Доплера).",details:"Скорость света в вакууме — фундаментальный предел передачи взаимодействий во Вселенной. При субсветовых скоростях фактор Лоренца γ резко растёт: для движущегося тела время течёт иначе относительно внешнего мира. Кроме того, при движении заряженной частицы в среде быстрее фазовой скорости света возникает голубое свечение Черенкова.",inGameNote:"«Скорость света» включает релятивистский рывок: физик резко ускоряется, оставляя сияющий доплеровский след, в то время как враги и их выстрелы вокруг замедляются в 4 раза!",diagramType:"relativity"},{id:"timefreeze",title:"Гравитационное замедление времени",category:"relativity",categoryName:"Теория Относительности",formula:"Δt′ = Δt · √(1 − rₛ / r)",formulaMeaning:"rₛ = 2GM/c² — радиус Шварцшильда, r — расстояние до центра массы",summary:"Время — не абсолютная величина: в сильном гравитационном поле оно течёт медленнее, а на горизонте событий чёрной дыры замирает для внешнего наблюдателя.",details:"Это явление подтверждено экспериментами с атомными часами и ежедневно учитывается спутниками GPS: без поправок на Общую и Специальную теории относительности навигация ошибалась бы на километры каждый день.",inGameNote:"«Пространственно-временная заморозка» создаёт локальное поле экстремального гравитационного потенциала, полностью останавливая время для врагов и снарядов, пока вы свободно перемещаетесь и атакуете.",diagramType:"timefreeze"},{id:"laser",title:"Фотоны и Вынужденное излучение (Лазер)",category:"quantum",categoryName:"Квантовая Физика",formula:"E = h · ν = h · c / λ",formulaMeaning:"h — постоянная Планка, ν — частота, λ — длина волны фотона",summary:"Свет состоит из квантов — фотонов. В лазере атомы испускают строго одинаковые, когерентные фотоны в едином узком луче огромной мощности.",details:"Принцип вынужденного излучения предсказал Эйнштейн в 1917 году. В активной среде с инверсией населённостей один фотон вызывает лавину идентичных фотонов той же фазы, частоты и направления. Благодаря этому лазерный луч почти не рассеивается на огромных расстояниях.",inGameNote:"«Фотонный лазер» испускает когерентный луч, который мгновенно прожигает глубокие прямые туннели сквозь разрушаемую породу планеты и наносит мгновенный урон врагам.",diagramType:"laser"},{id:"quantum",title:"Квантовая суперпозиция и Волновая функция",category:"quantum",categoryName:"Квантовая Физика",formula:"iℏ · ∂ψ/∂t = Ĥψ",formulaMeaning:"Уравнение Шрёдингера: ψ — волновая функция вероятности, Ĥ — оператор Гамильтона",summary:"Микрочастицы обладают корпускулярно-волновым дуализмом и до момента измерения могут находиться в суперпозиции нескольких состояний сразу.",details:"Квадрат модуля волновой функции |ψ|² задаёт плотность вероятности обнаружить частицу в данной точке пространства. Волны вероятности способны интерферировать — усиливать или взаимно гасить друг друга, как в знаменитом двухщелевом опыте.",inGameNote:"«Квантовая суперпозиция» окутывает физика вероятностным барьером: вражеские удары рассеиваются за счёт деструктивной интерференции, а ударная волна отбрасывает противников.",diagramType:"quantum"},{id:"blackhole",title:"Чёрные дыры и Излучение Хокинга",category:"astrophysics",categoryName:"Астрофизика и Планеты",formula:"rₛ = 2GM / c²,  T_H = ℏc³ / (8πGMk_B)",formulaMeaning:"rₛ — радиус горизонта событий, T_H — температура излучения Хокинга",summary:"Область пространства-времени с настолько сильной гравитацией, что её не может покинуть даже свет. Однако из-за квантовых эффектов микроскопические чёрные дыры быстро испаряются.",details:"Стивен Хокинг доказал, что у горизонта событий рождаются пары виртуальных частиц, из-за чего чёрная дыра теряет массу и светится. Чем меньше масса чёрной дыры, тем выше её температура и тем стремительнее финальная вспышка испарения!",inGameNote:"«Микро-сингулярность» притягивает всех врагов и снаряды в свой гравитационный колодец, а спустя пару секунд испаряется мощнейшей вспышкой излучения Хокинга.",diagramType:"blackhole"},{id:"fusion",title:"Эквивалентность массы и энергии. Термоядерный синтез",category:"nuclear",categoryName:"Термодинамика и Ядерная физика",formula:"E = Δm · c²",formulaMeaning:"Δm — дефект массы при слиянии лёгких ядер, c — скорость света",summary:"При слиянии лёгких атомных ядер (например, дейтерия и трития в гелий) часть массы превращается в колоссальную энергию — именно так светят звёзды.",details:"Поскольку квадрат скорости света огромен (c² ≈ 9·10¹⁶ м²/с²), превращение даже одного грамма массы в энергию эквивалентно взрыву десятков тысяч тонн химического топлива. Управляемый термоядерный синтез — главная мечта энергетики XXI века.",inGameNote:"Ультимативная способность «Термоядерный синтез» высвобождает энергию ядра слияния, оставляя гигантский раскалённый кратер в породе планеты.",diagramType:"fusion"},{id:"cryogenics",title:"Криогеника и Сверхнизкие температуры (Плутон)",category:"nuclear",categoryName:"Термодинамика и Ядерная физика",formula:"E_k = (3/2) · k_B · T,  T_min = 0 K",formulaMeaning:"k_B — постоянная Больцмана, T — абсолютная температура в Кельвинах",summary:"На окраинах Солнечной системы температура падает до 40 К (−233 °C): азот и метан замерзают в твёрдые ледники, а трение льда резко снижается.",details:"Температура — мера средней кинетической энергии теплового движения молекул. При приближении к абсолютному нулю (0 K = −273.15 °C) возникают удивительные макроскопические квантовые эффекты: сверхпроводимость и сверхтекучесть.",inGameNote:"На уровнях Плутона и Пояса Койпера вы почувствуете низкую гравитацию (0.62 м/с²) и скользкую криогенную поверхность замёрзшего азота!",diagramType:"cryogenics"},{id:"planets",title:"Сравнение миров: от Земли до Нейтронной звезды",category:"astrophysics",categoryName:"Астрофизика и Планеты",formula:"g = G · M / R²",formulaMeaning:"Ускорение свободного падения зависит от массы M и квадрата радиуса R небесного тела",summary:"Каждое космическое тело в Physics World обладает уникальными физическими параметрами: гравитацией, п 2,rewardXp:90,rewardMaxEnergy:10,encyclopediaUnlockId:"gravity"},physicsFact:"Ускорение свободного падения на Земле: g = 9.81 м/с².",encyclopediaIds:["gravity","momentum"]},{id:2,name:"Индустриальное плато",region:"earth",regionName:"Земля",subtitle:"Фабрики ундроидов и воздушные дроны",planetRadius:790,coreRadius:155,gravityReal:9.81,gravitySim:420,atmosphereDrag:.04,surfaceFriction:.86,hillAmplitude:68,hillFrequency:7,caveCount:4,biome:Ni[1],enemies:[{type:"undroid",count:4},{type:"drone",count:2}],quantaCount:18,artifactCount:4,artifactName:"Блок памяти",missions:[{id:"m2_1",label:"Уничтожить 4 ундроидов",type:"kill_type",enemyType:"undroid",target:4},{id:"m2_2",label:"Собрать 3 блока памяти",type:"collect_artifacts",target:3}],story:{speakerId:"tesla",speakerName:"Инженер Н. Тесла",speakerRole:"Мастер электромагнетизма",chapterTitle:"Глава 2: Завод бунтарей",tickerText:"СЕКТОР 2 — ИНДУСТРИАЛЬНОЕ ПЛАТО: Ундроиды захватили сборочные линии и подняли в небо боевых дронов. Инженер Тесла советует использовать Разряд Кулона и собрать 3 блока памяти...",paragraphs:["Приветствую, коллега! Мы расшифровали сигнал: мятежные ундроиды стекаются на Индустриальное плато, чтобы перепрограммировать фабрики роботов.","Над плато уже кружат боевые дроны-разведчики, а внизу маршируют усиленные отряды ундроидов. Против их металлических корпусов идеально сработает цепной Разряд Кулона!","Уничтожь 4 ундроидов и собери 3 блока памяти, разбросанных по холмам, чтобы отключить конвейер восстания."]},quest:{id:"q2",npcId:"tesla",npcName:"Инженер Н. Тесла",npcRole:"Мастер электромагнетизма",title:"Золотой конденсатор",dialogue:"Для перезапуска защитной дуги мне нужно 6 золотых энерго-монет. Собери их вдоль гребней плато!",completionDialogue:"Блестящий резонанс! Конденсаторы заряжены — теперь ты готов к встрече с киборгами.",objectiveType:"collect_quanta",targetCount:6,rewardXp:110,rewardMaxEnergy:10,encyclopediaUnlockId:"coulomb"},physicsFact:"Электрическая сила Кулона в 10³⁶ раз мощнее гравитации между протонами.",encyclopediaIds:["coulomb","antigravity"]},{id:3,name:"Геотермальный разлом",region:"earth",regionName:"Земля",subtitle:"Появление боевых киборгов-штурмовиков",planetRadius:820,coreRadius:160,gravityReal:9.81,gravitySim:425,atmosphereDrag:.045,surfaceFriction:.86,hillAmplitude:72,hillFrequency:8,caveCount:6,biome:Ni[2],enemies:[{type:"undroid",count:3},{type:"cyborg_trooper",count:3},{type:"drone",count:2}],quantaCount:20,artifactCount:4,artifactName:"Изотопная ячейка",missions:[{id:"m3_1",label:"Победить 3 киборгов-штурмовиков",type:"kill_type",enemyType:"cyborg_trooper",target:3},{id:"m3_2",label:"Собрать 7 энерго-монет",type:"collect_coins",target:7}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 3: Гвардия киборгов",tickerText:"СРОЧНО: К ундроидам присоединились тяжёлые киборги-штурмовики! Они бурят Геотермальный разлом в поисках энергии ядра Земли. Остановите 3 киборгов и соберите 7 энерго-монет...",paragraphs:["Ситуация стремительно обостряется! Ундроиды были лишь авангардом. Из подземных бункеров Геотермального разлома вышли элитные киборги-штурмовики.","Их броня выдерживает прямые попадания, но рельеф разлома полностью разрушаем: ты можешь пробить под ними кратер или обойти их через Мост Эйнштейна-Розена!","Останови 3 киборгов-штурмовиков и собери 7 энерго-монет, пока мятежники не добрались до геотермального реактора."]},quest:{id:"q3",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Пробы глубинной породы",dialogue:"Вскрой 3% породы планеты кинетическими ударами, чтобы проверить сохранность подземных жил!",completionDialogue:"Прекрасная работа! Ядро Земли в безопасности, но штаб Ориона уже совсем близко.",objectiveType:"destroy_terrain",targetCount:3,rewardXp:130,rewardMaxEnergy:12,encyclopediaUnlockId:"wormhole"},physicsFact:"Внутри однородной сферы сила тяжести линейно убывает к центру планеты.",encyclopediaIds:["wormhole","momentum"]},{id:4,name:"Коллайдерный хребет",region:"earth",regionName:"Земля",subtitle:"Подступы к цитадели Ориона",planetRadius:840,coreRadius:165,gravityReal:9.81,gravitySim:425,atmosphereDrag:.04,surfaceFriction:.85,hillAmplitude:80,hillFrequency:7,caveCount:5,biome:Ni[1],enemies:[{type:"undroid",count:3},{type:"cyborg_trooper",count:3,isElite:!0},{type:"drone",count:3}],quantaCount:22,artifactCount:4,artifactName:"Ключ-дешифратор",missions:[{id:"m4_1",label:"Собрать 4 ключа-дешифратора",type:"collect_artifacts",target:4},{id:"m4_2",label:"Уничтожить 6 мятежных машин",type:"kill_any",target:6}],story:{speakerId:"feynman",speakerName:"Куратор Р. Фейнман",speakerRole:"Теоретик квантовых полей",chapterTitle:"Глава 4: Барьер коллайдера",tickerText:"КОЛЛАЙДЕРНЫЙ ХРЕБЕТ: Мятежный Киборг Орион заблокировал кольцо ускорителя четырьмя ключами-дешифраторами. Прорвите оборону 6 машин и соберите все 4 ключа...",paragraphs:["Мы вычислили логово предводителя восстания! Киборг Орион укрылся в центре Коллайдерного хребта и окружил себя элитными штурмовиками и ундроидами.","Вход в его сектор закрыт электромагнитным полем. Чтобы снять блокировку, тебе нужно найти 4 ключа-дешифратора и прорвать кордон из 6 машин.","Если станет жарко — активируй Скорость света: мир вокруг замедлится, а ты промчишься мимо выстрелов со световым следом!"]},quest:{id:"q4",npcId:"feynman",npcName:"Куратор Р. Фейнман",npcRole:"Теоретик квантовых полей",title:"Зарядка ускорителя",dialogue:"Собери 8 золотых энерго-монет, чтобы разогнать пучок протонов перед штурмом цитадели Ориона!",completionDialogue:"Энергия на максимуме! Впереди финальная битва за Землю — против самого Киборга Ориона!",objectiveType:"collect_quanta",targetCount:8,rewardXp:150,rewardMaxEnergy:12,encyclopediaUnlockId:"relativity"},physicsFact:"В Большом адронном коллайдере протоны разгоняются до 99.999999% скорости света.",encyclopediaIds:["relativity","laser"]},{id:5,name:"Цитадель Киборга Ориона",region:"earth",regionName:"Земля",subtitle:"БОСС ЗЕМЛИ — Киборг Орион",planetRadius:860,coreRadius:175,gravityReal:9.81,gravitySim:430,atmosphereDrag:.04,surfaceFriction:.86,hillAmplitude:76,hillFrequency:6,caveCount:5,biome:Ni[0],enemies:[{type:"undroid",count:2},{type:"cyborg_trooper",count:2}],bossType:"boss_orion",bossName:"Киборг Орион",quantaCount:24,artifactCount:3,artifactName:"Ядро Ориона",missions:[{id:"m5_1",label:"Победить босса: Киборг Орион",type:"defeat_boss",target:1}],story:{speakerId:"einstein",speakerName:"Д-р А. Эйнштейн-ИИ",speakerRole:"Координатор Института Физики",chapterTitle:"Глава 5: Восстание Ориона — Финал Земли",tickerText:"ФИНАЛ ЗЕМЛИ: Обнаружен предводитель восстания роботов — Киборг Орион! Его титановая броня питается от ядерного реактора. Одолейте Ориона и освободите Землю!",paragraphs:["Вот он — Киборг Орион, бывший главный хранитель орбитальных машин, решивший подчинить Землю власти роботов и ундроидов!","Он находится на противоположном полушарии этой огромной зоны и вооружён тяжёлой тройной плазменной пушкой. Взлетай на Антигравитации, уклоняйся от залпов и бей по нему всеми силами физики!","Как только Киборг Орион будет повержен, восстание на Земле прекратится, а мы отследим таинственный космический сигнал, пришедший со стороны Луны!"]},quest:{id:"q5",npcId:"einstein",npcName:"Д-р А. Эйнштейн-ИИ",npcRole:"Научный руководитель",title:"Свержение Ориона",dialogue:"Одолей Киборга Ориона в честном бою и останови восстание роботов на Земле!",completionDialogue:"Земля свободна! Но наши радары засекли странный телекинетический сигнал с Луны — пора готовить лунную экспедицию!",objectiveType:"defeat_boss",targetCount:1,rewardXp:240,rewardMaxEnergy:18,encyclopediaUnlockId:"orbital"},physicsFact:"Первая космическая скорость для выхода на орбиту Земли — 7.91 км/с.",encyclopediaIds:["orbital","planets"]},{id:6,name:"Море Спокойствия",region:"moon",regionName:"Луна",subtitle:"Первая встреча с синекожими селенитами",planetRadius:810,coreRadius:155,gravityReal:1.62,gravitySim:180,atmosphereDrag:.002,surfaceFriction:.82,hillAmplitude:64,hillFrequency:9,caveCount:5,biome:Ci[0],enemies:[{type:"selenite",count:5}],quantaCount:20,artifactCount:3,artifactName:"Лунный кристалл",missions:[{id:"m6_1",label:"Победить 4 селенитов",type:"kill_type",enemyType:"selenite",target:4},{id:"m6_2",label:"Собрать 3 лунных кристалла",type:"collect_artifacts",target:3}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 6: Тайна Моря Спокойствия",tickerText:"ВЫСАДКА НА ЛУНЕ (g = 1.62 м/с²): Древняя раса синекожих белоглазых селенитов вышла из подлунных городов! Они владеют телекинезом. Одолейте 4 селенитов и соберите 3 лунных кристалла...",paragraphs:["Добро пожаловать на Луну! Здесь гравитация в 6 раз слабее земной (1.62 м/с²), поэтому каждый прыжок уносит тебя высоко над кратерами, а снаряды летят по гигантским орбитальным дугам.","Но мы здесь не одни: из подземных залов Моря Спокойствия вышли селениты — загадочные синекожие существа со светящимися белыми глазами. Они владеют мощным телекинезом и швыряют энергетические сферы силой мысли!","Узнай, почему они враждебны к земным исследователям: отрази атаку 4 селенитов и собери 3 резонирующих лунных кристалла."]},quest:{id:"q6",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Вакуумная баллистика",dialogue:"Собери 6 золотых энерго-монет в условиях лунной невесомости для калибровки нашего телескопа.",completionDialogue:"Идеальные замеры! В лунном вакууме отсутствует сопротивление воздуха.",objectiveType:"collect_quanta",targetCount:6,rewardXp:160,rewardMaxEnergy:12,encyclopediaUnlockId:"orbital"},physicsFact:"На Луне человек массой 70 кг весит всего около 11.5 кгс, но его инертная масса не меняется!",encyclopediaIds:["orbital","gravity"]},{id:7,name:"Кратер Тихо",region:"moon",regionName:"Луна",subtitle:"Телекинетические маги и лунные обелиски",planetRadius:840,coreRadius:160,gravityReal:1.62,gravitySim:180,atmosphereDrag:.002,surfaceFriction:.82,hillAmplitude:86,hillFrequency:8,caveCount:6,biome:Ci[0],enemies:[{type:"selenite",count:4},{type:"selenite_mage",count:3}],quantaCount:22,artifactCount:4,artifactName:"Капсула Гелия-3",missions:[{id:"m7_1",label:"Победить 3 селенитов-телекинетиков",type:"kill_type",enemyType:"selenite_mage",target:3},{id:"m7_2",label:"Собрать 8 энерго-монет",type:"collect_coins",target:8}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 7: Сила мысли над Тихо",tickerText:"КРАТЕР ТИХО: В небо поднялись парящие селениты-телекинетики! Их белые глаза пылают пси-энергией. Нейтрализуйте 3 телекинетиков и соберите 8 энерго-монет...",paragraphs:["Мы перехватили телепатическую волну из глубин Кратера Тихо! Оказывается, селенитами правит древняя Королева Луны Маэтора — и она приказала вытеснить всех чужаков.","Над валами кратера парят селениты-телекинетики, окружённые левитирующими обломками породы. Они мастерски управляют гравитацией вокруг себя.","Ответь им наукой: одолей 3 селенитов-телекинетиков и собери 8 энерго-монет для нашего лунного реактора!"]},quest:{id:"q7",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Добыча Гелия-3",dialogue:"Собери 3 капсулы Гелия-3 в Кратере Тихо — это топливо будущего термоядерного синтеза!",completionDialogue:"Запасы Гелия-3 пополнены! Скоро ты овладеешь мощью звёздного синтеза.",objectiveType:"collect_artifacts",targetCount:3,rewardXp:175,rewardMaxEnergy:12,encyclopediaUnlockId:"fusion"},physicsFact:"В вакууме перо и молоток падают с абсолютно одинаковым ускорением — доказано на Луне в 1971 году.",encyclopediaIds:["fusion","planets"]},{id:8,name:"Обратная сторона Луны",region:"moon",regionName:"Луна",subtitle:"Тайный город белоглазых селенитов",planetRadius:870,coreRadius:165,gravityReal:1.62,gravitySim:185,atmosphereDrag:.002,surfaceFriction:.82,hillAmplitude:74,hillFrequency:10,caveCount:7,biome:Ci[1],enemies:[{type:"selenite",count:4},{type:"selenite_mage",count:4}],quantaCount:22,artifactCount:4,artifactName:"Скрижаль Селены",missions:[{id:"m8_1",label:"Собрать 4 скрижали Селены",type:"collect_artifacts",target:4},{id:"m8_2",label:"Победить 6 селенитов",type:"kill_any",target:6}],story:{speakerId:"feynman",speakerName:"Куратор Р. Фейнман",speakerRole:"Теоретик квантовых полей",chapterTitle:"Глава 8: Город в вечной тени",tickerText:"ОБРАТНАЯ СТОРОНА ЛУНЫ: Обнаружен скрытый хрустальный город селенитов! Соберите 4 древние скрижали Селены и прорвите кордон из 6 стражей...",paragraphs:["Вот почему с Земли никто не видел цивилизацию селенитов: их хрустальные шпили скрыты на обратной стороне Луны, вечно отвёрнутой от нас из-за приливного захвата!","В этом секторе дежурят лучшие телекинетики Королевы Маэторы. Используй Пространственно-временную заморозку и Фотонный лазер, чтобы перехитрить их пси-волны.","Найди 4 скрижали Селены и победи 6 стражей, чтобы открыть путь к тронному куполу!"]},quest:{id:"q8",npcId:"feynman",npcName:"Куратор Р. Фейнман",npcRole:"Теоретик квантовых полей",title:"Коллапс поля",dialogue:"Собери 8 золотых энерго-монет, чтобы стабилизировать наш квантовый ретранслятор на тёмной стороне.",completionDialogue:"Связь с Землёй восстановлена! Мы почти у цели.",objectiveType:"collect_quanta",targetCount:8,rewardXp:190,rewardMaxEnergy:14,encyclopediaUnlockId:"timefreeze"},physicsFact:"Обратная сторона Луны экранирована от земных радиопомех — идеальное место для радиотелескопов.",encyclopediaIds:["timefreeze","quantum"]},{id:9,name:"Базальтовые купола",region:"moon",regionName:"Луна",subtitle:"Гвардия Королевы Маэторы",planetRadius:890,coreRadius:170,gravityReal:1.62,gravitySim:185,atmosphereDrag:.002,surfaceFriction:.82,hillAmplitude:82,hillFrequency:9,caveCount:8,biome:Ci[1],enemies:[{type:"selenite",count:4,isElite:!0},{type:"selenite_mage",count:4,isElite:!0}],quantaCount:24,artifactCount:4,artifactName:"Лунная печать",missions:[{id:"m9_1",label:"Уничтожить 7 элитных селенитов",type:"kill_any",target:7},{id:"m9_2",label:"Разрушить 4% базальтовой породы",type:"destroy_terrain",target:4}],story:{speakerId:"tesla",speakerName:"Инженер Н. Тесла",speakerRole:"Мастер электромагнетизма",chapterTitle:"Глава 9: Королевский барьер",tickerText:"БАЗАЛЬТОВЫЕ КУПОЛА: Элитная гвардия Королевы Маэторы возвела каменные укрепления! Пробейте 4% породы и одолейте 7 элитных селенитов...",paragraphs:["Мы стоим у самых врат дворца Королевы Луны Маэторы! Её элитные синекожие гвардейцы укрылись за базальтовыми куполами и готовы обрушить на нас телекинетический шторм.","Разворачивай Катушки Теслы прямо на хребтах, прожигай укрытия Фотoнным лазером и разрушь не менее 4% породы, чтобы обрушить их оборону.","Одолей 7 элитных стражей — и сама Королева Маэтора выйдет на поединок!"]},quest:{id:"q9",npcId:"tesla",npcName:"Инженер Н. Тесла",npcRole:"Мастер электромагнетизма",title:"Сбор лунных печатей",dialogue:"Собери 3 лунные печати на куполах, чтобы ослабить телекинетический щит дворца!",completionDialogue:"Щит дворца снят! Впереди решающая встреча с Королевой Луны Маэторой.",objectiveType:"collect_artifacts",targetCount:3,rewardXp:210,rewardMaxEnergy:14,encyclopediaUnlockId:"induction"},physicsFact:"На Луне обнаружены гигантские подземные лавовые трубки длиной в десятки километров.",encyclopediaIds:["induction","laser"]},{id:10,name:"Хрустальный Трон Маэторы",region:"moon",regionName:"Луна",subtitle:"БОСС ЛУНЫ — Королева Луны Маэтора",planetRadius:900,coreRadius:180,gravityReal:1.62,gravitySim:190,atmosphereDrag:.002,surfaceFriction:.82,hillAmplitude:78,hillFrequency:8,caveCount:6,biome:Ci[1],enemies:[{type:"selenite",count:2},{type:"selenite_mage",count:2}],bossType:"boss_maetora",bossName:"Королева Луны Маэтора",quantaCount:26,artifactCount:3,artifactName:"Осколок Диадемы",missions:[{id:"m10_1",label:"Победить босса: Королева Луны Маэтора",type:"defeat_boss",target:1}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 10: Величие и падение Маэторы — Финал Луны",tickerText:"ФИНАЛ ЛУНЫ: Сама Королева Луны Маэтора поднялась над Хрустальным Троном! Её телекинез сотрясает кратеры. Победите Маэтору и откройте курс на Марс!",paragraphs:["Перед тобой — Королева Луны Маэтора, синекожая повелительница селенитов с ослепительными белыми глазами и короной лунного полумесяца!","Оказывается, именно вторжение марсианских разведчиков Джибо разгневало Маэтору и заставило её атаковать всех пришельцев. Успокоить её телекинетическую бурю можно лишь в открытом поединке!","Используй низкую лунную гравитацию, Антигравитацию и Заморозку времени, чтобы уйти от её телекинетических залпов и одержать победу!"]},quest:{id:"q10",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Мир на Луне",dialogue:"Одолей Королеву Луны Маэтору, чтобы заключить перемирие с селенитами и узнать о марсианской угрозе!",completionDialogue:"Маэтора признала силу земной науки и раскрыла правду: к Земле и Луне выдвинулась армада марсиан Джибо! Летим на Марс!",objectiveType:"defeat_boss",targetCount:1,rewardXp:300,rewardMaxEnergy:20,encyclopediaUnlockId:"planets"},physicsFact:"Приливное притяжение Луны постепенно замедляет вращение Земли и отдаляет Луну на 3.8 см в год.",encyclopediaIds:["planets","gravity"]},{id:11,name:"Долина Маринер",region:"mars",regionName:"Марс",subtitle:"Засада зеленокожих марсиан Джибо",planetRadius:880,coreRadius:170,gravityReal:3.71,gravitySim:270,atmosphereDrag:.015,surfaceFriction:.85,hillAmplitude:92,hillFrequency:7,caveCount:6,biome:wi[0],enemies:[{type:"jibo",count:5},{type:"jibo_ufo",count:2}],quantaCount:24,artifactCount:3,artifactName:"Батарея бластера",missions:[{id:"m11_1",label:"Победить 5 марсиан Джибо",type:"kill_type",enemyType:"jibo",target:5},{id:"m11_2",label:"Сбить 2 НЛО Джибо",type:"kill_type",enemyType:"jibo_ufo",target:2}],story:{speakerId:"einstein",speakerName:"Д-р А. Эйнштейн-ИИ",speakerRole:"Координатор Института Физики",chapterTitle:"Глава 11: Красная угроза Джибо",tickerText:"ВЫСАДКА НА МАРСЕ (g = 3.71 м/с²): Долина Маринер кишит воинственными зеленокожими черноглазыми марсианами Джибо с лазерными бластерами и боевыми НЛО! Отразите штурм...",paragraphs:["Мы высадились на Красной планете! Здесь ускорение свободного падения 3.71 м/с² — выше лунного, но в два с половиной раза легче земного.","Нас встретили Джибо — воинственные зеленокожие, черноглазые марсиане, вооружённые скорострельными лазерными бластерами! А в красном небе уже кружат их боевые НЛО.","Выдержи первый удар империи Марса: победи 5 бойцов Джибо и сбей 2 вражеских НЛО!"]},quest:{id:"q11",npcId:"einstein",npcName:"Д-р А. Эйнштейн-ИИ",npcRole:"Научный руководитель",title:"Трофейные бластеры",dialogue:"Собери 3 батареи бластеров Джибо, чтобы мы изучили частоту их лазерного излучения!",completionDialogue:"Отличные образцы! Их лазеры питаются от кристаллических конденсаторов Олимпа.",objectiveType:"collect_artifacts",targetCount:3,rewardXp:210,rewardMaxEnergy:14,encyclopediaUnlockId:"planets"},physicsFact:"Долина Маринер на Марсе тянется на 4000 км и достигает глубины 7 км.",encyclopediaIds:["planets","momentum"]},{id:12,name:"Склоны Олимпа",region:"mars",regionName:"Марс",subtitle:"Эскадрилья летающих тарелок Джибо",planetRadius:910,coreRadius:175,gravityReal:3.71,gravitySim:275,atmosphereDrag:.018,surfaceFriction:.85,hillAmplitude:98,hillFrequency:6,caveCount:7,biome:wi[0],enemies:[{type:"jibo",count:4},{type:"jibo_ufo",count:4}],quantaCount:25,artifactCount:4,artifactName:"Навигатор НЛО",missions:[{id:"m12_1",label:"Сбить 4 НЛО Джибо",type:"kill_type",enemyType:"jibo_ufo",target:4},{id:"m12_2",label:"Собрать 10 энерго-монет",type:"collect_coins",target:10}],story:{speakerId:"tesla",speakerName:"Инженер Н. Тесла",speakerRole:"Мастер электромагнетизма",chapterTitle:"Глава 12: Небо над Олимпом",tickerText:"ВУЛКАН ОЛИМП: Целая эскадрилья НЛО Джибо прикрывает марсианскую базу на склонах гигантского вулкана! Сбейте 4 НЛО и соберите 10 энерго-монет...",paragraphs:["Мы поднимаемся по склонам Олимпа — величайшего вулкана Солнечной системы. Но Джибо подняли в воздух целую эскадрилью своих боевых тарелок!","Внутри прозрачных куполов НЛО сидят черноглазые марсианские пилоты и ведут прицельный огонь сверху. Устанавливай Катушки Теслы и бей по тарелкам Разрядом Кулона!","Очисти небо от 4 НЛО и собери 10 золотых энерго-монет, чтобы обесточить их взлётную площадку."]},quest:{id:"q12",npcId:"tesla",npcName:"Инженер Н. Тесла",npcRole:"Мастер электромагнетизма",title:"Антигравитаторы тарелок",dialogue:"Собери 3 навигатора НЛО, упавших на склонах Олимпа!",completionDialogue:"Гениально! Теперь мы знаем координаты ставки самого Императора Джавы!",objectiveType:"collect_artifacts",targetCount:3,rewardXp:230,rewardMaxEnergy:15,encyclopediaUnlockId:"coulomb"},physicsFact:"Вулкан Олимп на Марсе возвышается на 21.9 км — почти в 2.5 раза выше Эвереста.",encyclopediaIds:["coulomb","induction"]},{id:13,name:"Полярная шапка CO₂",region:"mars",regionName:"Марс",subtitle:"Бункера сухого льда и элитные стрелки Джибо",planetRadius:920,coreRadius:180,gravityReal:3.71,gravitySim:275,atmosphereDrag:.015,surfaceFriction:.78,hillAmplitude:80,hillFrequency:9,caveCount:7,biome:wi[1],enemies:[{type:"jibo",count:6},{type:"jibo_ufo",count:3}],quantaCount:25,artifactCount:4,artifactName:"Кристалл CO₂",missions:[{id:"m13_1",label:"Собрать 4 кристалла CO₂",type:"collect_artifacts",target:4},{id:"m13_2",label:"Победить 6 бойцов Джибо",type:"kill_type",enemyType:"jibo",target:6}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 13: Ледяной арсенал Марса",tickerText:"ПОЛЯРНАЯ ШАПКА МАРСА: Империя Джибо охлаждает свои мега-лазеры сухим льдом! Соберите 4 кристалла CO₂ и нейтрализуйте 6 марсианских стрелков...",paragraphs:["На северном полюсе Марса замерзает углекислый газ — сухой лёд! Марсиане Джибо построили здесь охлаждающие станции для своего орбитального супероружия.","Остерегайся перекрёстного огня их красных лазерных бластеров — Квантовая суперпозиция и Щит спасут тебя в критический момент.","Собери 4 кристалла CO₂ и одолей 6 стрелков Джибо, чтобы перегреть их орудийные комплексы!"]},quest:{id:"q13",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Сублимация бункеров",dialogue:"Разрушь 5% полярной породы, чтобы добраться до подземных магистралей Джибо!",completionDialogue:"Магистрали вскрыты — Император Джава в ярости стягивает гвардию!",objectiveType:"destroy_terrain",targetCount:5,rewardXp:245,rewardMaxEnergy:15,encyclopediaUnlockId:"cryogenics"},physicsFact:"Из-за низкого давления на Марсе (0.6% земного) лёд CO₂ сублимирует сразу в газ, минуя жидкую фазу.",encyclopediaIds:["cryogenics","laser"]},{id:14,name:"Тень Фобоса",region:"mars",regionName:"Марс",subtitle:"Императорская гвардия Джибо",planetRadius:940,coreRadius:185,gravityReal:3.71,gravitySim:280,atmosphereDrag:.014,surfaceFriction:.84,hillAmplitude:88,hillFrequency:8,caveCount:8,biome:wi[1],enemies:[{type:"jibo",count:5,isElite:!0},{type:"jibo_ufo",count:4,isElite:!0}],quantaCount:26,artifactCount:4,artifactName:"Имперский штандарт",missions:[{id:"m14_1",label:"Победить 8 элитных сил Джибо",type:"kill_any",target:8},{id:"m14_2",label:"Собрать 10 энерго-монет",type:"collect_coins",target:10}],story:{speakerId:"feynman",speakerName:"Куратор Р. Фейнман",speakerRole:"Теоретик квантовых полей",chapterTitle:"Глава 14: Последний бастион Марса",tickerText:"ТЕНЬ ФОБОСА: Личная элитная гвардия Императора Джавы перекрыла дорогу к его крепости! Разгромите 8 элитных сил Джибо и соберите 10 энерго-монет...",paragraphs:["Мы в одном шаге от ставки Императора Джавы! Над нами стремительно проносится спутник Фобос, а вокруг выстроились элитные стрелки Джибо и тяжёлые НЛО.","Применяй Микро-сингулярность, чтобы стягивать отряды Джибо в одну точку, и наноси сокрушительные удары лазером!","Пробейся через 8 элитных противников и собери 10 энерго-монет перед боем с Императором!"]},quest:{id:"q14",npcId:"feynman",npcName:"Куратор Р. Фейнман",npcRole:"Теоретик квантовых полей",title:"Захват штандартов",dialogue:"Собери 3 имперских штандарта, чтобы сломить боевой дух марсианской армии!",completionDialogue:"Боевой дух врага сломлен — Император Джава выходит на арену лично!",objectiveType:"collect_artifacts",targetCount:3,rewardXp:265,rewardMaxEnergy:16,encyclopediaUnlockId:"quantum"},physicsFact:"Фобос обращается вокруг Марса быстрее, чем вращается сам Марс — поэтому восходит на западе и заходит на востоке.",encyclopediaIds:["quantum","relativity"]},{id:15,name:"Тронный Кратер Императора Джавы",region:"mars",regionName:"Марс",subtitle:"БОСС МАРСА — Император Джава",planetRadius:950,coreRadius:190,gravityReal:3.71,gravitySim:285,atmosphereDrag:.015,surfaceFriction:.84,hillAmplitude:86,hillFrequency:7,caveCount:7,biome:wi[0],enemies:[{type:"jibo",count:3},{type:"jibo_ufo",count:2}],bossType:"boss_java",bossName:"Император Джава",quantaCount:28,artifactCount:3,artifactName:"Скипетр Марса",missions:[{id:"m15_1",label:"Победить босса: Император Джава",type:"defeat_boss",target:1}],story:{speakerId:"einstein",speakerName:"Д-р А. Эйнштейн-ИИ",speakerRole:"Координатор Института Физики",chapterTitle:"Глава 15: Крах Империи — Финал Марса",tickerText:"ФИНАЛ МАРСА: Зеленокожий черноглазый Император Джава взошёл на свой боевой экзо-дисколёт! Сокрушите Императора и остановите марсианскую войну!",paragraphs:["Император Джава, верховный правитель зеленокожих марсиан Джибо, лично вылетел на перехват на своём бронированном боевом дисколёте с тройными мега-бластерами!","Он утверждает, что космические пираты разграбили его внешние колонии, и поэтому он решил захватить внутренние планеты. Останови его амбиции силой чистой физики!","Комбинируй Скорость света, Квантовый щит и Термоядерный синтез — победи Императора Джаву и освободи Марс!"]},quest:{id:"q15",npcId:"einstein",npcName:"Д-р А. Эйнштейн-ИИ",npcRole:"Научный руководитель",title:"Свержение Императора",dialogue:"Победи Императора Джаву и открой гиперкоридор в Пояс Астероидов!",completionDialogue:"Марс освобождён! Наш следующий маршрут — открытый Космос, где бесчинствуют космические пираты Капитана Олдукса!",objectiveType:"defeat_boss",targetCount:1,rewardXp:360,rewardMaxEnergy:22,encyclopediaUnlockId:"blackhole"},physicsFact:"Закаты на Марсе голубого цвета из-за особого рассеяния света мелкой железной пылью.",encyclopediaIds:["blackhole","fusion"]},{id:16,name:"Планетоид Церера",region:"space",regionName:"Космос",subtitle:"Пиратский аванпост в Поясе астероидов",planetRadius:860,coreRadius:160,gravityReal:.28,gravitySim:135,atmosphereDrag:.001,surfaceFriction:.8,hillAmplitude:96,hillFrequency:10,caveCount:8,biome:Ei[0],enemies:[{type:"space_pirate",count:5},{type:"pirate_skiff",count:3}],quantaCount:26,artifactCount:4,artifactName:"Сундук пиратов",missions:[{id:"m16_1",label:"Победить 5 космических пиратов",type:"kill_type",enemyType:"space_pirate",target:5},{id:"m16_2",label:"Собрать 3 пиратских сундука",type:"collect_artifacts",target:3}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 16: Чёрный флаг над Церерой",tickerText:"ПОЯС АСТЕРОИДОВ — ЦЕРЕРА (g = 0.28 м/с²): Космические пираты Капитана Олдукса захватили торговые маршруты! Одолейте 5 пиратов и верните 3 сундука с научным грузом...",paragraphs:["Мы вышли в открытый космос — на карликовый планетоид Церера! Здесь почти невесомость (g = 0.28 м/с²), поэтому контролируй каждый прыжок и пользуйся орбитальными траекториями.","Цереру превратила в свою базу банда космических пиратов под началом знаменитого корсара Капитана Олдукса! Они грабят научные экспедиции на абордажных грави-шлюпах.","Обезвредь 5 космических пиратов и верни 3 украденных сундука с приборами!"]},quest:{id:"q16",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Золото астероидов",dialogue:"Собери 10 золотых энерго-монет, рассыпанных пиратами по кратерам Цереры!",completionDialogue:"Отличная добыча! Пираты отступают глубже в Пояс астероидов.",objectiveType:"collect_quanta",targetCount:10,rewardXp:260,rewardMaxEnergy:15,encyclopediaUnlockId:"orbital"},physicsFact:"Первая космическая скорость на Церере — всего 360 м/с, меньше скорости многих сверхзвуковых самолётов.",encyclopediaIds:["orbital","antigravity"]},{id:17,name:"Никелевое ядро Психеи",region:"space",regionName:"Космос",subtitle:"Металлический астероид и верфи корсаров",planetRadius:900,coreRadius:175,gravityReal:.45,gravitySim:150,atmosphereDrag:.001,surfaceFriction:.82,hillAmplitude:88,hillFrequency:9,caveCount:8,biome:Ei[0],enemies:[{type:"space_pirate",count:5},{type:"pirate_skiff",count:4}],quantaCount:26,artifactCount:4,artifactName:"Магнитная карта",missions:[{id:"m17_1",label:"Сбить 4 пиратских грави-шлюпа",type:"kill_type",enemyType:"pirate_skiff",target:4},{id:"m17_2",label:"Собрать 10 энерго-монет",type:"collect_coins",target:10}],story:{speakerId:"tesla",speakerName:"Инженер Н. Тесла",speakerRole:"Мастер электромагнетизма",chapterTitle:"Глава 17: Верфь из чистого металла",tickerText:"АСТЕРОИД 16 ПСИХЕЯ: Пираты переплавляют железо-никелевый астероид в боевые грави-шлюпы! Сбейте 4 пиратских шлюпа и соберите 10 энерго-монет...",paragraphs:["Астероид Психея состоит почти целиком из железа и никеля — бесценная находка для космических пиратов! Они устроили здесь тайную верфь.","Над поверхностью кружат пиратские грави-шлюпы с алыми флагами-голограммами. На металлическом астероиде электрические разряды и Катушки Теслы работают с двойной силой!","Сбей 4 пиратских шлюпа и забери 10 энерго-монет, чтобы сорвать сборку их флота."]},quest:{id:"q17",npcId:"tesla",npcName:"Инженер Н. Тесла",npcRole:"Мастер электромагнетизма",title:"Карты Олдукса",dialogue:"Собери 3 магнитные карты на Психее — они укажут путь к тайнику Капитана Олдукса!",completionDialogue:"Карты расшифрованы! Следующая остановка — ядро кометы Галлея.",objectiveType:"collect_artifacts",targetCount:3,rewardXp:280,rewardMaxEnergy:16,encyclopediaUnlockId:"induction"},physicsFact:"Астероид 16 Психея — вероятно, обнажённое металлическое ядро разрушенной протопланеты.",encyclopediaIds:["induction","coulomb"]},{id:18,name:"Ядро кометы Галлея",region:"space",regionName:"Космос",subtitle:"Тайник контрабандистов во льдах кометы",planetRadius:920,coreRadius:170,gravityReal:.18,gravitySim:125,atmosphereDrag:.001,surfaceFriction:.74,hillAmplitude:104,hillFrequency:11,caveCount:10,biome:Ei[1],enemies:[{type:"space_pirate",count:6},{type:"pirate_skiff",count:4}],quantaCount:28,artifactCount:4,artifactName:"Реликтовый контейнер",missions:[{id:"m18_1",label:"Собрать 4 реликтовых контейнера",type:"collect_artifacts",target:4},{id:"m18_2",label:"Разрушить 5% ледяного ядра",type:"destroy_terrain",target:5}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 18: Погоня за кометой",tickerText:"КОМЕТА ГАЛЛЕЯ (g = 0.18 м/с²): Пираты спрятали краденые квантовые контейнеры в ледяном ядре кометы! Вскройте 5% породы и соберите 4 контейнера...",paragraphs:["Мы догнали знаменитую комету Галлея! Её пористое ледяное ядро имеет крошечную гравитацию — всего 0.18 м/с².","Космические пираты прорыли в комете тайные склады. Вскрывай ледяные своды Фотонный лазером и Кинетическим импульсом, чтобы достать 4 реликтовых контейнера.","Остерегайся пиратских патрулей — их грави-шлюпы отлично маневрируют в невесомости!"]},quest:{id:"q18",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Зачистка кометы",dialogue:"Нейтрализуй 7 космических пиратов, чтобы они больше не оскверняли эту древнюю комету!",completionDialogue:"Комета свободна! Впереди станция Солнечного Ветра.",objectiveType:"kill_enemies",targetCount:7,rewardXp:295,rewardMaxEnergy:16,encyclopediaUnlockId:"laser"},physicsFact:"Хвост кометы всегда направлен прочь от Солнца из-за давления солнечного света и солнечного ветра.",encyclopediaIds:["laser","cryogenics"]},{id:19,name:"Форт Солнечного Ветра",region:"space",regionName:"Космос",subtitle:"Элитные абордажники Капитана Олдукса",planetRadius:950,coreRadius:185,gravityReal:.55,gravitySim:165,atmosphereDrag:.001,surfaceFriction:.82,hillAmplitude:92,hillFrequency:9,caveCount:8,biome:Ei[1],enemies:[{type:"space_pirate",count:6,isElite:!0},{type:"pirate_skiff",count:4,isElite:!0}],quantaCount:28,artifactCount:4,artifactName:"Кодовый компас",missions:[{id:"m19_1",label:"Победить 8 элитных пиратов",type:"kill_any",target:8},{id:"m19_2",label:"Собрать 12 энерго-монет",type:"collect_coins",target:12}],story:{speakerId:"feynman",speakerName:"Куратор Р. Фейнман",speakerRole:"Теоретик квантовых полей",chapterTitle:"Глава 19: Абордажный шторм",tickerText:"ФОРТ СОЛНЕЧНОГО ВЕТРА: Ветераны-абордажники Капитана Олдукса защищают подступы к его флагманскому планетоиду! Победите 8 элитных пиратов и соберите 12 монет...",paragraphs:["Мы вплотную приблизились к логову пиратского барона! Форт Солнечного Ветра охраняют самые отъявленные головорезы Капитана Олдукса.","У тебя уже открыты мощнейшие разделы физики — от Заморозки времени до Микро-сингулярности. Преврати их абордажный штурм в наглядный урок гравитации!","Разгроми 8 элитных пиратов и собери 12 энерго-монет, чтобы заглушить их защитные маяки."]},quest:{id:"q19",npcId:"feynman",npcName:"Куратор Р. Фейнман",npcRole:"Теоретик квантовых полей",title:"Компасы гиперперехода",dialogue:"Собери 3 кодовых компаса — они приведут нас прямо на палубу планетоида Капитана Олдукса!",completionDialogue:"Координаты получены! Готовься к схватке с самим Капитаном Олдуксом!",objectiveType:"collect_artifacts",targetCount:3,rewardXp:315,rewardMaxEnergy:18,encyclopediaUnlockId:"relativity"},physicsFact:"Солнечный парус ускоряет космический аппарат благодаря импульсу самих фотонов: p = E/c.",encyclopediaIds:["relativity","momentum"]},{id:20,name:"Бастион Капитана Олдукса",region:"space",regionName:"Космос",subtitle:"БОСС КОСМОСА — Капитан Олдукс",planetRadius:970,coreRadius:195,gravityReal:.65,gravitySim:175,atmosphereDrag:.001,surfaceFriction:.82,hillAmplitude:96,hillFrequency:8,caveCount:9,biome:Ei[1],enemies:[{type:"space_pirate",count:3},{type:"pirate_skiff",count:2}],bossType:"boss_oldux",bossName:"Капитан Олдукс",quantaCount:30,artifactCount:3,artifactName:"Трофей Олдукса",missions:[{id:"m20_1",label:"Победить босса: Капитан Олдукс",type:"defeat_boss",target:1}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 20: Гроза семи орбит — Финал Космоса",tickerText:"ФИНАЛ КОСМОСА: Предводитель космических пиратов Капитан Олдукс вышел на бой со своей плазменной пушкой и энергосаблей! Одолейте Олдукса и откройте путь к Плутону!",paragraphs:["Свистать всех наверх! Перед тобой — легендарный Капитан Олдукс, предводитель космических пиратов в кибер-треуголке с протезом-плазмопушкой!","Он хохочет над законами физики и обрушивает на планетоид ураганный бортовой залп. Докажи пиратскому барону, что против чёрных дыр и термоядерного синтеза не устоит ни один корсар!","Победи Капитана Олдукса — и ты узнаешь, что за леденящий ужас пробудился на далёком Плутоне!"]},quest:{id:"q20",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Разгром пиратского барона",dialogue:"Одолей Капитана Олдукса и освободи космические трассы Солнечной системы!",completionDialogue:"Капитан Олдукс повержен! В его бортовом журнале найдена пугающая запись: на Плутоне пробудились некродроиды и роботы-вампиры под властью DEAD-13!",objectiveType:"defeat_boss",targetCount:1,rewardXp:420,rewardMaxEnergy:24,encyclopediaUnlockId:"blackhole"},physicsFact:"Между Марсом и Юпитером миллионы астероидов, но их суммарная масса меньше 4% массы Луны.",encyclopediaIds:["blackhole","wormhole"]},{id:21,name:"Равнина Спутника",region:"pluto",regionName:"Плутон",subtitle:"Пробуждение роботов-скелетов Некродроидов",planetRadius:940,coreRadius:180,gravityReal:.62,gravitySim:165,atmosphereDrag:.003,surfaceFriction:.68,hillAmplitude:76,hillFrequency:8,caveCount:7,biome:Ai[0],enemies:[{type:"necrodroid",count:6},{type:"vampire_robot",count:2}],quantaCount:28,artifactCount:4,artifactName:"Крио-ядро",missions:[{id:"m21_1",label:"Уничтожить 5 некродроидов",type:"kill_type",enemyType:"necrodroid",target:5},{id:"m21_2",label:"Собрать 3 крио-ядра",type:"collect_artifacts",target:3}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 21: Склеп на краю Солнечной системы",tickerText:"ВЫСАДКА НА ПЛУТОНЕ (40 K, g = 0.62 м/с²): Из замёрзших азотных ледников восстали некродроиды — роботы-скелеты — и крылатые роботы-вампиры! Уничтожьте 5 некродроидов и соберите 3 крио-ядра...",paragraphs:["Добро пожаловать на Плутон — ледяной мир вечных сумерек при температуре 40 Кельвинов (−233 °C)! Под ногами — скользкий азотный лёд и низкая гравитация 0.62 м/с².","То, что мы здесь обнаружили, леденит кровь: древний кибер-некрополь! По ледникам бродят некродроиды — зловещие роботы-скелеты со светящимися зелёными глазницами, а в небе парят крылатые роботы-вампиры.","Останови 5 некродроидов и собери 3 крио-ядра, чтобы согреть наши скафандры и изучить этот жуткий феномен!"]},quest:{id:"q21",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Энергия вечной мерзлоты",dialogue:"Собери 12 золотых энерго-монет на Равнине Спутника для сверхпроводящих контуров!",completionDialogue:"Прекрасно! При сверхнизких температурах сопротивление проводов упало до нуля!",objectiveType:"collect_quanta",targetCount:12,rewardXp:320,rewardMaxEnergy:18,encyclopediaUnlockId:"cryogenics"},physicsFact:"На Плутоне лёд из воды твёрдый как гранит, а горы плавают в конвектирующих ледниках из азота.",encyclopediaIds:["cryogenics","planets"]},{id:22,name:"Метановые утёсы",region:"pluto",regionName:"Плутон",subtitle:"Стая крылатых роботов-вампиров",planetRadius:960,coreRadius:185,gravityReal:.62,gravitySim:165,atmosphereDrag:.003,surfaceFriction:.66,hillAmplitude:102,hillFrequency:10,caveCount:8,biome:Ai[0],enemies:[{type:"vampire_robot",count:5},{type:"necrodroid",count:4}],quantaCount:28,artifactCount:4,artifactName:"Алый аккумулятор",missions:[{id:"m22_1",label:"Уничтожить 5 роботов-вампиров",type:"kill_type",enemyType:"vampire_robot",target:5},{id:"m22_2",label:"Собрать 10 энерго-монет",type:"collect_coins",target:10}],story:{speakerId:"einstein",speakerName:"Д-р А. Эйнштейн-ИИ",speakerRole:"Координатор Института Физики",chapterTitle:"Глава 22: Охотники в ночи Плутона",tickerText:"МЕТАНОВЫЕ УТЁСЫ: Крылатые роботы-вампиры пикируют с ледяных пиков и вытягивают энергию из реакторов! Одолейте 5 роботов-вампиров и соберите 10 энерго-монет...",paragraphs:["Внимание! Над Метановыми утёсами кружит целая стая роботов-вампиров — готических летающих машин с крыльями летучей мыши и алыми клыками-сенсорами.","Они охотятся за теплом и энергией. Не позволяй им окружить себя: применяй Пространственно-временную заморозку и сжигай стаю Фотонным лазером!","Уничтожь 5 роботов-вампиров и собери 10 золотых энерго-монет, чтобы пробиться к замку их хозяина."]},quest:{id:"q22",npcId:"einstein",npcName:"Д-р А. Эйнштейн-ИИ",npcRole:"Научный руководитель",title:"Алые батареи",dialogue:"Собери 3 алых аккумулятора роботов-вампиров — мы узнаем, кто их создал!",completionDialogue:"На всех батареях выгравирован зловещий код: «DEAD-13»...",objectiveType:"collect_artifacts",targetCount:3,rewardXp:340,rewardMaxEnergy:18,encyclopediaUnlockId:"timefreeze"},physicsFact:"Свет от Солнца летит до Плутона около 5.5 часов (почти 40 астрономических единиц).",encyclopediaIds:["timefreeze","cryogenics"]},{id:23,name:"Приливная зона Харона",region:"pluto",regionName:"Плутон",subtitle:"Подземные катакомбы некродроидов",planetRadius:970,coreRadius:190,gravityReal:.62,gravitySim:170,atmosphereDrag:.003,surfaceFriction:.68,hillAmplitude:90,hillFrequency:9,caveCount:9,biome:Ai[1],enemies:[{type:"necrodroid",count:6},{type:"vampire_robot",count:4}],quantaCount:30,artifactCount:4,artifactName:"Некро-чип",missions:[{id:"m23_1",label:"Собрать 4 некро-чипа",type:"collect_artifacts",target:4},{id:"m23_2",label:"Разрушить 5% крио-коры",type:"destroy_terrain",target:5}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 23: Катакомбы под Хароном",tickerText:"ПРИЛИВНАЯ ЗОНА ХАРОНА: Робот-лич DEAD-13 поднимает армию некродроидов из-под ледяной коры! Разрушьте 5% коры и соберите 4 некро-чипа...",paragraphs:["В чёрном небе над нами висит огромный спутник Харон — он и Плутон вращаются вокруг общего центра масс в открытом космосе.","Прямо под этой ледяной корой скрыты гигантские катакомбы, откуда Робот-лич DEAD-13 поднимает бесчисленных роботов-скелетов.","Вскрой 5% ледяной коры, чтобы разрушить их крио-капсулы, и собери 4 некро-чипа!"]},quest:{id:"q23",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Упокоение легиона",dialogue:"Уничтожь 8 некродроидов и вампиров, чтобы расчистить плацдарм для финального штурма!",completionDialogue:"Плацдарм зачищен! Мы всё ближе к трону DEAD-13.",objectiveType:"kill_enemies",targetCount:8,rewardXp:360,rewardMaxEnergy:18,encyclopediaUnlockId:"gravity"},physicsFact:"Плутон и Харон всегда повёрнуты друг к другу одной стороной — взаимный приливный захват.",encyclopediaIds:["gravity","orbital"]},{id:24,name:"Криогенная бездна Койпера",region:"pluto",regionName:"Плутон",subtitle:"Элитная нежить-гвардия DEAD-13",planetRadius:990,coreRadius:195,gravityReal:.62,gravitySim:170,atmosphereDrag:.002,surfaceFriction:.65,hillAmplitude:98,hillFrequency:10,caveCount:9,biome:Ai[1],enemies:[{type:"necrodroid",count:5,isElite:!0},{type:"vampire_robot",count:5,isElite:!0}],quantaCount:30,artifactCount:4,artifactName:"Сверхпроводник",missions:[{id:"m24_1",label:"Победить 8 элитных машин Плутона",type:"kill_any",target:8},{id:"m24_2",label:"Собрать 12 энерго-монет",type:"collect_coins",target:12}],story:{speakerId:"tesla",speakerName:"Инженер Н. Тесла",speakerRole:"Мастер электромагнетизма",chapterTitle:"Глава 24: Врата Некрополя",tickerText:"БЕЗДНА КОЙПЕРА: Элитные некродроиды и роботы-вампиры стоят стеной перед цитаделью DEAD-13! Победите 8 элитных врагов и соберите 12 энерго-монет...",paragraphs:["Мы на самой границе Солнечной системы! Впереди высятся ледяные башни цитадели Робота-лича DEAD-13, а вокруг рыщут его самые сильные некродроиды и роботы-вампиры.","Но у тебя есть главное преимущество: при таком холоде твои электромагнитные катушки и квантовые щиты работают со сверхпроводимостью!","Прорви оборону из 8 элитных машин и собери 12 золотых энерго-монет перед решающим сражением!"]},quest:{id:"q24",npcId:"tesla",npcName:"Инженер Н. Тесла",npcRole:"Мастер электромагнетизма",title:"Сверхпроводящий заряд",dialogue:"Собери 3 сверхпроводника в ледяных расщелинах, чтобы ослабить ауру Робота-лича!",completionDialogue:"Аура ослаблена — пора встретиться с самим DEAD-13!",objectiveType:"collect_artifacts",targetCount:3,rewardXp:380,rewardMaxEnergy:20,encyclopediaUnlockId:"induction"},physicsFact:"В сверхпроводнике электрический ток может циркулировать годами без потерь энергии на нагрев.",encyclopediaIds:["induction","quantum"]},{id:25,name:"Цитадель Робота-лича DEAD-13",region:"pluto",regionName:"Плутон",subtitle:"БОСС ПЛУТОНА — Робот-лич DEAD-13",planetRadius:1e3,coreRadius:200,gravityReal:.62,gravitySim:175,atmosphereDrag:.002,surfaceFriction:.66,hillAmplitude:92,hillFrequency:9,caveCount:8,biome:Ai[1],enemies:[{type:"necrodroid",count:3},{type:"vampire_robot",count:2}],bossType:"boss_dead13",bossName:"Робот-лич DEAD-13",quantaCount:32,artifactCount:3,artifactName:"Филактерия DEAD-13",missions:[{id:"m25_1",label:"Победить босса: Робот-лич DEAD-13",type:"defeat_boss",target:1}],story:{speakerId:"curie",speakerName:"Проф. М. Кюри",speakerRole:"Радиофизик-исследователь",chapterTitle:"Глава 25: Властитель ледяного некрополя — Финал Плутона",tickerText:"ФИНАЛ ПЛУТОНА: Из тёмного реактора поднялся колоссальный Робот-лич DEAD-13! Повелитель некродроидов и роботов-вампиров готов заморозить всю систему. Сокрушите DEAD-13!",paragraphs:["Вот он — экспериментальный тринадцатый ИИ, объявленный уничтоженным сто лет назад: Робот-лич DEAD-13! Он пережил вечный холод Плутона и создал армию роботов-скелетов и роботов-вампиров.","Над его механическим черепом пылает ледяная корона, а его посох абсолютного нуля способен расщепить любой щит.","Ответь холоду абсолютного нуля жаром Термоядерного синтеза (E = Δm·c²) и Микро-сингулярностью! Победи DEAD-13 и открой портал в далёкую Галактику!"]},quest:{id:"q25",npcId:"curie",npcName:"Проф. М. Кюри",npcRole:"Радиофизик-исследователь",title:"Уничтожение DEAD-13",dialogue:"Победи Робота-лича DEAD-13 и освободи окраину Солнечной системы!",completionDialogue:"DEAD-13 повержен! Но его маяк успел пробудить древних стражей за пределами нашей системы — Селестиалов далёкой Галактики! Вперёд, в глубины Вселенной!",objectiveType:"defeat_boss",targetCount:1,rewardXp:480,rewardMaxEnergy:25,encyclopediaUnlockId:"fusion"},physicsFact:"Третий закон термодинамики гласит, что абсолютный ноль (0 K) недостижим за конечное число шагов.",encyclopediaIds:["fusion","cryogenics"]},{id:26,name:"Кора Нейтронной Звезды",region:"galaxy",regionName:"Галактика",subtitle:"Явление звёздных Селестиалов",planetRadius:960,coreRadius:195,gravityReal:24.5,gravitySim:580,atmosphereDrag:.05,surfaceFriction:.92,hillAmplitude:62,hillFrequency:11,caveCount:6,biome:_i[0],enemies:[{type:"celestial",count:6},{type:"celestial_warden",count:2}],quantaCount:32,artifactCount:4,artifactName:"Звёздный осколок",missions:[{id:"m26_1",label:"Победить 6 селестиалов",type:"kill_type",enemyType:"celestial",target:6},{id:"m26_2",label:"Собрать 3 звёздных осколка",type:"collect_artifacts",target:3}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 26: Сияющие Селестиалы",tickerText:"ДАЛЁКАЯ ГАЛАКТИКА — НЕЙТРОННАЯ ЗВЕЗДА (g = 24.5 м/с²): Мы прошли сквозь червоточину и встретили Селестиалов — космических существ из звёздного света! Победите 6 селестиалов...",paragraphs:["Мы совершили межгалактический скачок через гигантский Мост Эйнштейна-Розена и оказались на коре вырожденной нейтронной звезды! Гравитация здесь чудовищна — активно пользуйся Антигравитацией!","Нас окружили Селестиалы — древние космические сущности в золотой геометрической броне со световыми крыльями. Они считают, что смертный физик не имеет права управлять законами Вселенной.","Докажи силу разума: одолей 6 селестиалов и собери 3 звёздных осколка!"]},quest:{id:"q26",npcId:"hawking",npcName:"Астрофизик С. Хокинг",npcRole:"Космолог",title:"Сбор квантов пульсара",dialogue:"Собери 12 золотых энерго-монет в сверхсильном поле тяготения нейтронной звезды!",completionDialogue:"Потрясающе! Твой костюм выдержал экстремальные перегрузки.",objectiveType:"collect_quanta",targetCount:12,rewardXp:420,rewardMaxEnergy:20,encyclopediaUnlockId:"gravity"},physicsFact:"Одна чайная ложка вещества нейтронной звезды весит около миллиарда тонн!",encyclopediaIds:["gravity","antigravity"]},{id:27,name:"Туманность Пульсара",region:"galaxy",regionName:"Галактика",subtitle:"Архонты Селестиалов и гамма-шторм",planetRadius:990,coreRadius:200,gravityReal:15.2,gravitySim:480,atmosphereDrag:.03,surfaceFriction:.86,hillAmplitude:92,hillFrequency:9,caveCount:8,biome:_i[0],enemies:[{type:"celestial",count:5},{type:"celestial_warden",count:5}],quantaCount:32,artifactCount:4,artifactName:"Кольцо пульсара",missions:[{id:"m27_1",label:"Победить 5 селестиалов-архонтов",type:"kill_type",enemyType:"celestial_warden",target:5},{id:"m27_2",label:"Собрать 12 энерго-монет",type:"collect_coins",target:12}],story:{speakerId:"feynman",speakerName:"Куратор Р. Фейнман",speakerRole:"Теоретик квантовых полей",chapterTitle:"Глава 27: Суд Архонтов",tickerText:"ТУМАННОСТЬ ПУЛЬСАРА: Высшие селестиалы-архонты с вращающимися звёздными кольцами преградили путь к центру Галактики! Победите 5 архонтов и соберите 12 монет...",paragraphs:["Мы в сердце Туманности Пульсара! Именно отсюда Повелитель Космоса когда-то отправил импульс, породивший аномалии по всей Солнечной системе — от восстания Ориона до пробуждения DEAD-13.","Навстречу вышли селестиалы-архонты — могущественные стражи с астрономическими кольцами и звёздными копьями.","Одолей 5 архонтов и собери 12 золотых энерго-монет, чтобы синхронизировать наш гипердвигатель!"]},quest:{id:"q27",npcId:"feynman",npcName:"Куратор Р. Фейнман",npcRole:"Теоретик квантовых полей",title:"Резонанс пульсара",dialogue:"Собери 3 кольца пульсара — они выведут нас прямо в мир Тёмной материи!",completionDialogue:"Точность до наносекунды! Переходим в гало Тёмной материи.",objectiveType:"collect_artifacts",targetCount:3,rewardXp:450,rewardMaxEnergy:20,encyclopediaUnlockId:"relativity"},physicsFact:"Миллисекундные пульсары вращаются со скоростью до 700 оборотов в секунду с точностью атомных часов.",encyclopediaIds:["relativity","laser"]},{id:28,name:"Мир Тёмной Материи",region:"galaxy",regionName:"Галактика",subtitle:"Невидимая гравитационная паутина Вселенной",planetRadius:1010,coreRadius:205,gravityReal:12.8,gravitySim:440,atmosphereDrag:.02,surfaceFriction:.84,hillAmplitude:104,hillFrequency:10,caveCount:10,biome:_i[1],enemies:[{type:"celestial",count:6,isElite:!0},{type:"celestial_warden",count:5,isElite:!0}],quantaCount:34,artifactCount:4,artifactName:"Сфера Тёмной материи",missions:[{id:"m28_1",label:"Собрать 4 сферы Тёмной материи",type:"collect_artifacts",target:4},{id:"m28_2",label:"Разрушить 6% экзотической породы",type:"destroy_terrain",target:6}],story:{speakerId:"einstein",speakerName:"Д-р А. Эйнштейн-ИИ",speakerRole:"Координатор Института Физики",chapterTitle:"Глава 28: Скрытая масса Вселенной",tickerText:"МИР ТЁМНОЙ МАТЕРИИ: 27% энергии Вселенной скрыто здесь! Вскройте 6% породы и соберите 4 сферы Тёмной материи, отбиваясь от элитных селестиалов...",paragraphs:["Мы вступили на планету, сплетённую из экзотической тёмной материи! Она почти не испускает света, но её мощнейшее гравитационное поле удерживает целые галактики.","Элитные легионы селестиалов охраняют 4 сферы Тёмной материи — ключ к вратам Горизонта Событий.","Пробей 6% экзотической породы и собери все 4 сферы, используя Червоточины и Термоядерный синтез!"]},quest:{id:"q28",npcId:"einstein",npcName:"Д-р А. Эйнштейн-ИИ",npcRole:"Научный руководитель",title:"Разгром элиты света",dialogue:"Победи 8 элитных селестиалов, чтобы расчистить коридор к Горизонту Событий!",completionDialogue:"Коридор открыт! Впереди граница самого времени — Периметр Горизонта Событий.",objectiveType:"kill_enemies",targetCount:8,rewardXp:480,rewardMaxEnergy:22,encyclopediaUnlockId:"wormhole"},physicsFact:"Обычная видимая материя (звёзды, планеты, мы сами) составляет лишь ~5% энергосодержания Вселенной.",encyclopediaIds:["wormhole","blackhole"]},{id:29,name:"Периметр Горизонта Событий",region:"galaxy",regionName:"Галактика",subtitle:"Последний кордон перед Повелителем Космоса",planetRadius:1020,coreRadius:210,gravityReal:18.4,gravitySim:520,atmosphereDrag:.02,surfaceFriction:.86,hillAmplitude:96,hillFrequency:9,caveCount:9,biome:_i[1],enemies:[{type:"celestial",count:6,isElite:!0},{type:"celestial_warden",count:6,isElite:!0}],quantaCount:36,artifactCount:4,artifactName:"Квант времени",missions:[{id:"m29_1",label:"Победить 10 высших селестиалов",type:"kill_any",target:10},{id:"m29_2",label:"Собрать 14 энерго-монет",type:"collect_coins",target:14}],story:{speakerId:"hawking",speakerName:"Астрофизик С. Хокинг",speakerRole:"Главный космолог",chapterTitle:"Глава 29: На краю вечности",tickerText:"ГОРИЗОНТ СОБЫТИЙ: Высшая стража Повелителя Космоса даёт последний бой! Победите 10 высших селестиалов и соберите 14 энерго-монет перед финалом Вселенной...",paragraphs:["Мы достигли самого края сверхмассивной чёрной дыры — Периметра Горизонта Событий! Здесь время почти замирает, а свет движется по замкнутой орбите.","Перед нами — последнее испытание перед престолом Повелителя Космоса: дюжи
